name: "Nym Privacy Hub"
description: "Dezentraler SOCKS5 Mixnet-Proxy, Ingress-Dashboard & Privatsphäre-Schild für Home Assistant"
slug: "nym_privacy_hub"
version: "1.0.9"
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock
panel_title: "Nym Privacy"
ports:
  1080/tcp: 1080
ports_description:
  1080/tcp: "SOCKS5 Mixnet Proxy Port"
map:
  - config:rw
  - share:rw
  - data:rw
options:
  provider: "Entztfv6Uaz2hpYHQJ6JKoaCTpDL5dja18SuQWVJAmmx.Cvhn9rBJw5Ay9wgHcbgCnVg89MPSV5s2muPV2YF1BXYu@Fo4f4SQLdoyoGkFae5TpVhRVoXCF8UiypLVGtGjujVPf"
  use_reply_surbs: true
  cover_traffic: false
  cover_traffic_rate: 10
  anonymity_mode: "high_privacy"
  surb_buffer_size: 50
  passphrase: ""
  log_level: "info"
schema:
  provider: str
  use_reply_surbs: bool
  cover_traffic: bool
  cover_traffic_rate: int?
  anonymity_mode: list(eco|high_privacy|ultra_stealth)?
  surb_buffer_size: int?
  passphrase: password?
  log_level: list(trace|debug|info|warn|error)?
